<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal clip test</title>
<style>
body{margin:0;padding:16px;background:#0a0a0b;color:#f4f4f5;font:15px/1.45 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 6px} h2{font-size:15px;margin:22px 0 8px;color:#fbbf24}
.box{background:#131316;border:1px solid #25252b;border-radius:14px;padding:12px;margin-bottom:12px}
.v{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sub{color:#8b8b94;font-size:13px} .ok{color:#22c55e} .bad{color:#ef4444}
</style></head><body>
<h1>Goal clip test</h1>
<div class="sub">Tap play on each video. Tell Claude which ones play (A, B, C).</div>

<h2>A · NHL player — Meier goal tonight</h2>
<div class="box"><div class="v"><iframe src="https://www.nhl.com/video/embed/6408574032112" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>

<h2>B · Brightcove player — same goal</h2>
<div class="box"><div class="v"><iframe src="https://players.brightcove.net/6415718365001/EXtG1xJ7H_default/index.html?videoId=6408574032112" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>

<h2>D · Phone's own player, highest quality — same goal</h2>
<div class="box"><div id="dinfo" class="sub">Finding the HD version…</div>
<video id="dv" controls playsinline preload="metadata" style="width:100%;border-radius:10px;background:#000;margin-top:8px;display:none"></video></div>
<script>
(async()=>{
  const info=document.getElementById('dinfo'), v=document.getElementById('dv');
  const ACC='6415718365001', PLAYER='EXtG1xJ7H_default', VID='6408574032112';
  try{
    const cfg=await (await fetch(`https://players.brightcove.net/${ACC}/${PLAYER}/config.json`)).json();
    const pk=cfg?.video_cloud?.policy_key; if(!pk) throw new Error('no key in player config');
    const r=await fetch(`https://edge.api.brightcove.com/playback/v1/accounts/${ACC}/videos/${VID}`,{headers:{Accept:'application/json;pk='+pk}});
    if(!r.ok) throw new Error('video service said '+r.status);
    const j=await r.json();
    const mp4=(j.sources||[]).filter(s=>s.container==='MP4'&&s.src&&s.src.startsWith('https')).sort((a,b)=>(b.height||0)-(a.height||0));
    const hls=(j.sources||[]).find(s=>(s.type||'').includes('mpegURL')&&s.src&&s.src.startsWith('https'));
    const pick=mp4[0]||hls; if(!pick) throw new Error('no playable source');
    v.src=pick.src; if(j.poster) v.poster=j.poster; v.style.display='block';
    info.innerHTML='<span class="ok">Found</span> — '+(mp4[0]?`MP4 ${mp4[0].width}×${mp4[0].height}`:'adaptive stream')+'. Tap play.';
  }catch(e){info.innerHTML='<span class="bad">Couldn\'t get the HD version</span> ('+e.message+')';}
})();
</script>

<h2>C · Can the app read the NHL's goal list directly?</h2>
<div class="box" id="c">Checking…</div>
<script>
fetch('https://api-web.nhle.com/v1/gamecenter/2026020345/landing').then(r=>r.json()).then(d=>{
  const n=(d.summary?.scoring||[]).reduce((t,p)=>t+(p.goals||[]).length,0);
  document.getElementById('c').innerHTML='<span class="ok">Yes</span> — read '+n+' goals live from the NHL.';
}).catch(e=>{document.getElementById('c').innerHTML='<span class="bad">No</span> — blocked ('+e.message+'). We\'d use the GitHub job instead.';});
</script>
</body></html>
