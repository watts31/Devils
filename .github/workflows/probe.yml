name: One-time data probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for f in playoff_graph.csv points_graph.csv; do curl -sL -A "$UA" "https://moneypuck.com/moneypuck/simulations/$f" -o probe/$f; echo "$f $(wc -l < probe/$f) lines"; head -c 700 probe/$f; echo; tail -c 400 probe/$f; echo; done
          rm -f probe/simdir.html probe/teamsummary.json
          for f in probe/*.csv; do (head -4 "$f"; echo ...; tail -3 "$f") > "$f.head"; rm "$f"; done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Temporary: probe results" && git pull --rebase && git push
