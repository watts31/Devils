name: One-time goal clip test
on:
  push:
    paths: ['.github/workflows/clip-test.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe NHL goal clips
        run: |
          mkdir -p cliptest
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -s "https://api-web.nhle.com/v1/club-schedule-season/NJD/now" -o cliptest/schedule.json
          # most recent finished game + any live game
          IDS=$(python3 - <<'PY'
          import json
          g=json.load(open('cliptest/schedule.json'))['games']
          done=[x for x in g if x.get('gameState') in ('OFF','FINAL')]
          live=[x for x in g if x.get('gameState') in ('LIVE','CRIT')]
          ids=[str(x['id']) for x in (done[-1:]+live)]
          print(' '.join(ids))
          PY
          )
          echo "games: $IDS" | tee cliptest/games.txt
          for id in $IDS; do curl -s "https://api-web.nhle.com/v1/gamecenter/$id/landing" -o cliptest/landing_$id.json; done
          # pull every URL-ish clip field from the first game's goals
          python3 - <<'PY' > cliptest/clips.txt
          import json,glob
          for f in sorted(glob.glob('cliptest/landing_*.json')):
              d=json.load(open(f))
              print('==',f,d.get('gameState'))
              for per in d.get('summary',{}).get('scoring',[]):
                  for g in per.get('goals',[]):
                      keep={k:v for k,v in g.items() if any(s in k.lower() for s in ('clip','highlight','video','url','replay'))}
                      print(g.get('firstName',{}).get('default'),g.get('lastName',{}).get('default'),g.get('timeInPeriod'),json.dumps(keep))
          PY
          cat cliptest/clips.txt
          # check whether clip pages / players allow being embedded in another site
          python3 - <<'PY' > cliptest/urls.txt
          import json,glob,re
          urls=set()
          for f in glob.glob('cliptest/landing_*.json'):
              t=open(f).read()
              urls.update(re.findall(r'https?://[^"\\ ]+',t))
          for u in sorted(urls):
              if any(s in u for s in ('video','clip','brightcove','highlight','nhl.com/')): print(u)
          PY
          head -40 cliptest/urls.txt
          n=0; while read -r u; do n=$((n+1)); [ $n -gt 6 ] && break; echo "### $u" >> cliptest/headers.txt; curl -sIL -A "$UA" "$u" | grep -iE '^(HTTP|location|x-frame-options|content-security-policy|content-type)' >> cliptest/headers.txt; done < cliptest/urls.txt
          # try the Brightcove player page for the first clip id, if any
          CID=$(grep -oE '"highlightClip": ?[0-9]+' cliptest/landing_*.json | head -1 | grep -oE '[0-9]+$')
          echo "clipid=$CID" >> cliptest/headers.txt
          if [ -n "$CID" ]; then
            for u in "https://players.brightcove.net/6415718365001/EXtG1xJ7H_default/index.html?videoId=$CID" "https://www.nhl.com/video/embed/$CID"; do
              echo "### $u" >> cliptest/headers.txt; curl -sIL -A "$UA" "$u" | grep -iE '^(HTTP|location|x-frame-options|content-security-policy|content-type)' >> cliptest/headers.txt
            done
          fi
          cat cliptest/headers.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cliptest && git commit -m "Temporary: goal clip test results" && git pull --rebase && git push
