name: One-time goal clip test
on:
  push:
    paths: ['.github/workflows/clip-test.yml','scripts/clip-probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe NHL goal clips
        run: python3 scripts/clip-probe.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cliptest && git commit -m "Temporary: goal clip test results" && git pull --rebase && git push
